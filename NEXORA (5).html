const AVC=['#a855f7','#60a5fa','#34d399','#fb923c','#f472b6','#facc15'],AU={tab:'login'};
const resetTM=()=>Object.assign(TM,{acc:0,t0:null,run:false,plan:null,topic:'',goal:0,pauses:0,h:null,ntd:0});
Object.assign(A,{
sb:()=>{S.sb=!S.sb;save();render()},
tmGo:()=>{const now=Date.now();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
 if(TM.run){TM.acc+=(now-TM.t0)/1000;TM.t0=null;TM.run=false;TM.pauses++}else{TM.run=true;TM.t0=now;if(TM.h==null)TM.h=hr();TM.ntd=TM.goal&&TM.el>=TM.goal*60?1:0}render()},
tmReset:()=>{const g=TM.plan?0:TM.goal;resetTM();TM.goal=g;document.title='NEXORA';render()},
tmSave:()=>{const e=TM.el;if(e<5){toast('Study for a few more seconds to save a session.');return}const p=TM.plan&&by(S.plans,TM.plan);
 S.sessions.unshift({id:uid(),topic:TM.topic||'Free session',sec:e,d:dk(new Date()),h:TM.h==null?hr():TM.h,goal:TM.goal,pauses:TM.pauses});if(p&&e>=p.min*60)p.done=true;A.tmReset();go();toast('Session saved · '+hm(Math.max(1,Math.round(e/60))))},
ldP:i=>{if(TM.el>0){toast('Save or reset the current session first.');return}const p=by(S.plans,i);resetTM();Object.assign(TM,{plan:p.id,topic:p.topic,goal:p.min});render();scrollTo(0,0)},
trk:r=>{tr.r=r;render()},mood:m=>{const d=dk(new Date());(S.reflect[d]=S.reflect[d]||{}).m=+m;go()},
clrT:async()=>{if(await dlg('Delete today’s study sessions?',false,'Delete')){S.sessions=S.sessions.filter(s=>s.d!=dk(new Date()));go()}},
/* accounts */
atab:t=>{AU.tab=t;renderAuth()},
async login(){const em=val('au_e').toLowerCase(),pw=$('#au_p').value,u=USERS.find(x=>x.email==em);if(!em||!pw)return aerr('Enter your email and password.');
 if(!u||await hash(pw,u.salt)!=u.hash)return aerr('Incorrect email or password.');start(u,$('#au_k').checked)},
async signup(){const nm=val('au_n'),em=val('au_e').toLowerCase(),pw=$('#au_p').value,q=$('#au_q').value;
 if(nm.length<2)return aerr('Please enter your name.');if(!/^\S+@\S+\.\S+$/.test(em))return aerr('Enter a valid email address.');
 if(pw.length<6)return aerr('Password must be at least 6 characters.');if(pw!==q)return aerr('Passwords do not match.');
 if(USERS.some(x=>x.email==em))return aerr('An account with this email already exists. Try logging in.');
 const salt=uid()+uid(),u={id:uid()+uid(),name:nm,email:em,role:$('#au_r').value,color:AVC[USERS.length%AVC.length],salt,hash:await hash(pw,salt),created:Date.now()};
 const legacy=USERS.length==0?jget('nexora',null):null;if(legacy){try{LS.setItem('nexora_d_'+u.id,JSON.stringify(legacy))}catch(e){}}
 USERS.push(u);saveUsers();start(u,$('#au_k').checked);toast('Welcome to NEXORA, '+nm.split(' ')[0]+'!')},
logout:()=>{save();endSession()},
avc:c=>{CU.color=c;saveUsers();render()},
saveProf:()=>{const n=val('pn');if(n.length<2){toast('Name is too short.');return}CU.name=n;CU.role=$('#pr').value;S.profile.name=n;saveUsers();go();toast('Profile saved')},
async chpw(){const r=await frm('Change password',[['o','Current password','password'],['n','New password','password'],['c','Confirm new password','password']],'Update',async v=>{if(await hash(v.o,CU.salt)!=CU.hash)return'Current password is incorrect.';if(v.n.length<6)return'New password must be at least 6 characters.';if(v.n!==v.c)return'Passwords do not match.';return null});
 if(r){CU.salt=uid()+uid();CU.hash=await hash(r.n,CU.salt);saveUsers();toast('Password updated')}},
async delAcc(){const r=await frm('Delete account',[['p','Enter your password to confirm','password']],'Delete forever',async v=>await hash(v.p,CU.salt)!=CU.hash?'Incorrect password.':null,'This permanently removes this profile and all of its data from this browser.');
 if(r){USERS=USERS.filter(x=>x.id!=CU.id);saveUsers();try{LS.removeItem('nexora_d_'+CU.id)}catch(e){}CU=null;endSession(true)}}});
/* accounts: helpers */
const subtle=window.crypto&&crypto.subtle,hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(pw,salt){if(subtle){try{const k=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}catch(e){}}
 let h=2166136261;for(const ch of salt+pw){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(16)}
function renderAuth(){document.body.classList.add('out');const su=AU.tab=='signup',en=su?'signup':'login';
 $('#au').innerHTML=`<div class="c aucard"><div class=logo>NEXORA</div><p class=m style="margin-bottom:18px">${su?'Create your profile — your plans, sessions and Study Mirror stay yours.':'Welcome back. Pick up where you left off.'}</p>
 <div class=row><button class="b s ${su?'g0':'on'}" data-a=atab data-i=login>Log in</button><button class="b s ${su?'on':'g0'}" data-a=atab data-i=signup>Create account</button></div>
 ${su?`<label>Full name</label><input id=au_n autocomplete=name data-en=${en}>`:''}
 <label>Email</label><input id=au_e type=email autocomplete=email data-en=${en}>
 ${su?`<label>I am a</label><select id=au_r><option>Student</option><option>Self-learner</option><option>Professional</option><option>Teacher</option></select>`:''}
 <label>Password</label><input id=au_p type=password autocomplete=${su?'new-password':'current-password'} data-en=${en}>
 ${su?`<label>Confirm password</label><input id=au_q type=password autocomplete=new-password data-en=signup>`:''}
 <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;margin-top:14px"><input type=checkbox id=au_k checked> Keep me signed in on this device</label>
 <p class=err id=ae></p><button class="b" style="width:100%;margin-top:6px" data-a=${en}>${su?'Create account':'Log in'}</button>
 <p class="m sm" style="margin-top:16px">Accounts are stored privately in this browser. Each profile has its own plans, sessions, tasks and themes.</p></div>`}
const aerr=m=>{const e=$('#ae');if(e)e.textContent=m};
function start(u,keep){CU=u;try{if(keep){LS.setItem('nexora_session',u.id);sessionStorage.removeItem('nexora_session')}else{sessionStorage.setItem('nexora_session',u.id);LS.removeItem('nexora_session')}}catch(e){}
 load(jget('nexora_d_'+u.id,null));S.profile.name=u.name;resetTM();apply();document.body.classList.remove('out');$('#au').innerHTML='';render(true)}
function endSession(){try{LS.removeItem('nexora_session');sessionStorage.removeItem('nexora_session')}catch(e){}CU=null;resetTM();load({theme:S.theme});apply();document.title='NEXORA';AU.tab='login';renderAuth()}
function frm(title,fields,ok,check,note){return new Promise(res=>{box(`<h3>${title}</h3>${note?`<p class="m sm">${note}</p>`:''}${fields.map(([id,l,ty,v])=>`<label>${l}</label><input id="f_${id}" type="${ty||'text'}" value="${esc(v||'')}" style="width:100%">`).join('')}<p class=err id=fe></p><div class=row><button class="b g0" data-x=0>Cancel</button><button class=b data-x=1>${ok||'Save'}</button></div>`);
 const m=$('#md'),f=m.querySelector('input');f&&f.focus();const dn=x=>{closeBox();m.onclick=m.onkeydown=null;res(x)};
 const get=()=>Object.fromEntries(fields.map(([id])=>[id,$('#f_'+id).value]));
 const go2=async()=>{const v=get(),er=check?await check(v):null;if(er){$('#fe').textContent=er;return}dn(v)};
 m.onclick=e=>{const x=e.target.dataset.x;if(e.target==m||x=='0')dn(null);else if(x=='1')go2()};
 m.onkeydown=e=>{if(e.key=='Enter')go2();if(e.key=='Escape')dn(null)}})}
document.addEventListener('input',e=>{const t=e.target;if(t.id=='gh'||t.id=='gm'){const g=Math.max(0,Math.min(1440,(+val('gh')||0)*60+(+val('gm')||0)));TM.goal=g;TM.ntd=g&&TM.el>=g*60?1:0;tmUp()}});
document.addEventListener('visibilitychange',()=>{if(CU)tmUp()});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='tp')TM.topic=t.value;if(t.id=='rn'){const d=dk(new Date());(S.reflect[d]=S.reflect[d]||{}).n=t.value;save()}});
document.addEventListener('change',e=>{if(e.target.id=='pn')render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b.dataset.j,b)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.dataset.en)A[e.target.dataset.en](e.target.dataset.i);if(e.key=='Escape'&&$('#fs.on'))A.fsx()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){$('#fs').classList.remove('on');document.body.classList.remove('fsm')}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='cb'||t.id=='cc'||t.id=='ac'){if(t.id=='ac')S.acc=t.value;else{S.custom[t.id=='cb'?'bg':'ac']=t.value;S.theme='custom'}save();apply()}
if(t.id=='nt'||t.id=='nb'){const n=by(S.notes,ni.id);if(n){n[t.id=='nt'?'t':'b']=t.value;save();const s=$('#ns');s&&(s.textContent='Saved ✓')}}});
document.addEventListener('change',e=>{if(e.target.id=='if'){const f=e.target.files[0],r=new FileReader();r.onload=()=>{$('#ij').value=r.result};f&&r.readAsText(f)}if(e.target.id=='cb'||e.target.id=='cc')render()});
let it;const idle=()=>{const f=$('#fs');f.classList.remove('idle');clearTimeout(it);it=setTimeout(()=>f.classList.add('idle'),2800)};['mousemove','touchstart'].forEach(e=>document.addEventListener(e,()=>$('#fs.on')&&idle(),{passive:true}));
apply();
(function(){let id=null;try{id=LS.getItem('nexora_session')||sessionStorage.getItem('nexora_session')}catch(e){}const u=USERS.find(x=>x.id==id);u?start(u,!!LS.getItem('nexora_session')):renderAuth()})();
setInterval(tick,1000);
